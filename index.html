<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Mastodon Jukebox</title>
  <style>
    body { font-family: sans-serif; background: #191b22; color: #fff; text-align: center; padding: 20px; }
    #player { margin: 20px auto; max-width: 800px; }
    .playlist { max-width: 600px; margin: 0 auto; text-align: left; background: #282c37; padding: 15px; border-radius: 8px; }
    .playlist-item { padding: 8px; border-bottom: 1px solid #393f4f; cursor: pointer; }
    .playlist-item.active { color: #6364ff; font-weight: bold; }
  </style>
</head>
<body>

  <h2>🎵 우리 서버 주크박스</h2>
  <p id="status">타임라인에서 음악을 불러오는 중...</p>
  
  <!-- 유튜브 플레이어가 렌더링될 영역 -->
  <div id="player"></div>
  
  <!-- 재생 목록 표시 영역 -->
  <div class="playlist" id="playlist"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // 1. 설정값 변경
    const INSTANCE_DOMAIN = 'example.com'; // 본인 마스토돈 도메인 입력
    const HASHTAG = '노동요'; // 수집할 해시태그 (로컬 전체를 원하면 API 주소를 ?local=true 로 변경)

    let videoIds = [];
    let currentIndex = 0;
    let player;

    // 2. 유튜브 링크에서 Video ID 추출하는 정규식
    function extractYouTubeId(url) {
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
      const match = url.match(regExp);
      return match ? match[1] : null;
    }

    // 3. 마스토돈 공개 API에서 툿 가져오기
    async function fetchToots() {
      // 특정 해시태그 타임라인 조회 (로컬 타임라인 전체를 원하면 /api/v1/timelines/public?local=true&limit=40 사용)
      const apiUrl = `https://${INSTANCE_DOMAIN}/api/v1/timelines/tag/${encodeURIComponent(HASHTAG)}?limit=40`;
      
      try {
        const response = await fetch(apiUrl);
        const toots = await response.json();
        const parser = new DOMParser();

        toots.forEach(toot => {
          const doc = parser.parseFromString(toot.content, 'text/html');
          const links = doc.querySelectorAll('a');
          
          links.forEach(link => {
            const videoId = extractYouTubeId(link.href);
            // 중복 제거 후 배열에 추가
            if (videoId && !videoIds.some(item => item.id === videoId)) {
              videoIds.push({
                id: videoId,
                author: toot.account.display_name || toot.account.username,
                url: link.href
              });
            }
          });
        });

        if (videoIds.length > 0) {
          document.getElementById('status').innerText = `총 ${videoIds.length}개의 영상을 찾았습니다.`;
          renderPlaylist();
          initPlayer();
        } else {
          document.getElementById('status').innerText = '재생할 유튜브 링크를 찾지 못했습니다.';
        }
      } catch (error) {
        document.getElementById('status').innerText = 'API를 불러오는 데 실패했습니다 (CORS 또는 도메인 확인 필요).';
        console.error(error);
      }
    }

    // 4. 유튜브 플레이어 초기화 및 연속 재생 로직
    function initPlayer() {
      player = new YT.Player('player', {
        height: '450',
        width: '800',
        videoId: videoIds[0].id,
        playerVars: { 'autoplay': 1, 'rel': 0 },
        events: {
          'onStateChange': onPlayerStateChange,
          'onError': playNext // 재생 불가 영상일 경우 자동으로 다음 곡으로 이동
        }
      });
    }

    function onPlayerStateChange(event) {
      // 영상이 끝났을 때 (YT.PlayerState.ENDED === 0)
      if (event.data === YT.PlayerState.ENDED) {
        playNext();
      }
    }

    function playNext() {
      currentIndex++;
      if (currentIndex < videoIds.length) {
        player.loadVideoById(videoIds[currentIndex].id);
        renderPlaylist();
      } else {
        document.getElementById('status').innerText = '모든 재생 목록이 끝났습니다.';
      }
    }

    function renderPlaylist() {
      const container = document.getElementById('playlist');
      container.innerHTML = videoIds.map((item, idx) => `
        <div class="playlist-item ${idx === currentIndex ? 'active' : ''}" onclick="jumpTo(${idx})">
          ${idx + 1}. [추천: ${item.author}] (ID: ${item.id})
        </div>
      `).join('');
    }

    window.jumpTo = function(index) {
      currentIndex = index;
      player.loadVideoById(videoIds[currentIndex].id);
      renderPlaylist();
    };

    // YouTube API가 준비되면 툿 수집 시작
    function onYouTubeIframeAPIReady() {
      fetchToots();
    }
  </script>
</body>
</html>
