<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Mastodon Jukebox</title>
  <style>
    body { font-family: sans-serif; background: #191b22; color: #fff; text-align: center; padding: 20px; }
    #player { margin: 20px auto; max-width: 800px; }
    .playlist { max-width: 600px; margin: 0 auto; text-align: left; background: #282c37; padding: 15px; border-radius: 8px; }
    .playlist-item { padding: 8px; border-bottom: 1px solid #393f4f; cursor: pointer; }
    .playlist-item.active { color: #6364ff; font-weight: bold; }
  </style>
</head>
<body>

  <h2>🎵 우리 서버 주크박스</h2>
  <p id="status">타임라인에서 음악을 불러오는 중...</p>
  
  <div id="player"></div>
  <div class="playlist" id="playlist"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // ==========================================
    // 1. 서버 및 토큰 설정값 변경
    // ==========================================
    const INSTANCE_DOMAIN = 'cryptb.site'; // 본인 마스토돈 도메인 (https:// 제외)
    const ACCESS_TOKEN = '-cdF2VNAZ1cLyHYf0kHVB1pomunpeoieugyTtr6MuNw'; 
    
    // 수집 모드 선택: 'hashtag' (특정 해시태그), 'local' (로컬 타임라인 전체), 'account' (특정 계정이 작성한 툿)
    const FETCH_MODE = 'hashtag'; 
    const HASHTAG = '노동요';       // FETCH_MODE가 'hashtag'일 때 사용할 태그명 (# 제외)
    const ACCOUNT_ID = '117145132200298739'; // FETCH_MODE가 'account'일 때 사용할 대상 계정의 숫자 ID

    let videoIds = [];
    let currentIndex = 0;
    let player;

    // 2. 유튜브 Video ID 추출 정규식 (일반 영상, 쇼츠, 단축 URL, 뮤직 모두 대응)
    function extractYouTubeId(url) {
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
      const match = url.match(regExp);
      return match ? match[1] : null;
    }

    // 3. 수집 모드별 API URL 생성
    function getApiUrl() {
      if (FETCH_MODE === 'hashtag') {
        return `https://${INSTANCE_DOMAIN}/api/v1/timelines/tag/${encodeURIComponent(HASHTAG)}?limit=40`;
      } else if (FETCH_MODE === 'local') {
        return `https://${INSTANCE_DOMAIN}/api/v1/timelines/public?local=true&limit=40`;
      } else if (FETCH_MODE === 'account') {
        return `https://${INSTANCE_DOMAIN}/api/v1/accounts/${ACCOUNT_ID}/statuses?limit=40&exclude_reblogs=false`;
      }
    }

    // 4. 마스토돈 API 호출 (Authorization 헤더 포함)
    async function fetchToots() {
      const apiUrl = getApiUrl();
      
      try {
        const response = await fetch(apiUrl, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${ACCESS_TOKEN}`,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}`);
        }

        const toots = await response.json();
        const parser = new DOMParser();

        toots.forEach(toot => {
          // 부스트(리블로그)한 툿일 경우 원본 툿의 내용을 가져옴
          const targetToot = toot.reblog ? toot.reblog : toot;
          const doc = parser.parseFromString(targetToot.content, 'text/html');
          const links = doc.querySelectorAll('a');
          
          links.forEach(link => {
            const videoId = extractYouTubeId(link.href);
            if (videoId && !videoIds.some(item => item.id === videoId)) {
              videoIds.push({
                id: videoId,
                author: targetToot.account.display_name || targetToot.account.username,
                url: link.href
              });
            }
          });
        });

        if (videoIds.length > 0) {
          document.getElementById('status').innerText = `총 ${videoIds.length}개의 영상을 찾았습니다.`;
          renderPlaylist();
          initPlayer();
        } else {
          document.getElementById('status').innerText = '재생할 유튜브 링크를 찾지 못했습니다.';
        }
      } catch (error) {
        document.getElementById('status').innerText = `API 호출 실패 (${error.message}) - 토큰 권한이나 도메인을 확인하세요.`;
        console.error(error);
      }
    }

    // 5. 유튜브 플레이어 초기화 및 연속 재생
    function initPlayer() {
      player = new YT.Player('player', {
        height: '450',
        width: '800',
        videoId: videoIds[0].id,
        playerVars: { 'autoplay': 1, 'rel': 0 },
        events: {
          'onStateChange': onPlayerStateChange,
          'onError': playNext
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        playNext();
      }
    }

    function playNext() {
      currentIndex++;
      if (currentIndex < videoIds.length) {
        player.loadVideoById(videoIds[currentIndex].id);
        renderPlaylist();
      } else {
        document.getElementById('status').innerText = '모든 재생 목록이 끝났습니다.';
      }
    }

    function renderPlaylist() {
      const container = document.getElementById('playlist');
      container.innerHTML = videoIds.map((item, idx) => `
        <div class="playlist-item ${idx === currentIndex ? 'active' : ''}" onclick="jumpTo(${idx})">
          ${idx + 1}. [작성자: ${item.author}] (ID: ${item.id})
        </div>
      `).join('');
    }

    window.jumpTo = function(index) {
      currentIndex = index;
      player.loadVideoById(videoIds[currentIndex].id);
      renderPlaylist();
    };

    function onYouTubeIframeAPIReady() {
      fetchToots();
    }
  </script>
</body>
</html>
